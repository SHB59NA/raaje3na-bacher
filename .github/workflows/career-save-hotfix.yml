name: Load reception graphics prototype v1.3.0
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach graphics layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="reception-v3.js?v=1.2.0"></script>'
          new=old+'\n<script src="reception-graphics-v1.js?v=1.3.0"></script>'
          if 'reception-graphics-v1.js?v=1.3.0' not in s:
              if old not in s:
                  raise SystemExit('reception v3 loader not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate graphics JavaScript
        run: |
          node --check reception-graphics-v1.js
          grep -q 'reception-graphics-v1.js?v=1.3.0' index.html

      - name: Validate graphics assets
        run: |
          test -f assets/prototype/reception_scene_bg.webp
          test -f assets/prototype/crt_monitor.webp
          test -f assets/prototype/desk_phone.webp
          test -f assets/prototype/document_tray.webp
          test -f assets/prototype/approval_stamp.webp
          test -f assets/prototype/rejection_stamp.webp
          test -f assets/prototype/tea_glass.webp
          test -f assets/prototype/alnouran_id_card.webp

      - name: Commit loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load reception graphics prototype v1.3.0"
          git push
