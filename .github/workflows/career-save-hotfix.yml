name: Apply reception conversations v1.1.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch question answer conversations
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check reception-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          if not m: raise SystemExit('No embedded script')
          Path('/tmp/base-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/base-game.js
      - name: Commit conversation gameplay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reception-v2.js index.html
          git diff --cached --quiet || git commit -m "Make reception questions real conversations"
          git push
