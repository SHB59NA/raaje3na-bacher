name: Apply Career save hotfix
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Career save namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>راجعنا باچر — Career v1.0</title>', '<title>راجعنا باچر — Career v1.0.1</title>')
          s = s.replace('v1.0 // CAREER SYSTEM', 'v1.0.1 // CAREER SYSTEM')
          old = """const SAVE={
 salary:'raaje3na_salary_v1',rank:'raaje3na_rank_v1',ministry:'raaje3na_ministry_v1',
 coworker:'raaje3na_coworker_v1',heat:'raaje3na_wasta_heat_v1',day:'raaje3na_day_v1'
};"""
          new = """const SAVE={
 salary:'raaje3na_career_salary_v1',rank:'raaje3na_career_rank_v1',ministry:'raaje3na_career_ministry_v1',
 coworker:'raaje3na_career_coworker_v1',heat:'raaje3na_career_wasta_heat_v1',day:'raaje3na_career_day_v1'
};"""
          if old not in s:
              raise SystemExit('SAVE block not found')
          s = s.replace(old, new)
          old_rank = "let rank=num(localStorage.getItem(SAVE.rank),salary>=400?3:salary>=200?2:1);"
          new_rank = "let rank=num(localStorage.getItem(SAVE.rank),1);"
          if old_rank not in s:
              raise SystemExit('rank init not found')
          s = s.replace(old_rank, new_rank)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Career save migration and starting rank"
          git push
