name: Load optional dialogue history v1.4.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach dialogue toggle
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); anchor='<script src=\"reception-drag-v1.js?v=1.4.0\"></script>'; tag='<script src=\"reception-dialogue-toggle.js?v=1.4.1\"></script>'; assert anchor in s, 'drag loader not found'; s=s if tag in s else s.replace(anchor,anchor+'\\n'+tag,1); p.write_text(s,encoding='utf-8')"

      - name: Validate dialogue toggle
        run: |
          node --check reception-dialogue-toggle.js
          node --check reception-drag-v1.js
          grep -q 'reception-dialogue-toggle.js?v=1.4.1' index.html
          grep -q 'dialogueLogCollapsed' reception-dialogue-toggle.js
          grep -q 'سجل الحوار' reception-dialogue-toggle.js
          if grep -q 'new MutationObserver' reception-dialogue-toggle.js; then
            echo 'Dialogue toggle must stay event-driven'
            exit 1
          fi

      - name: Commit dialogue loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make dialogue history optional v1.4.1"
          git push
