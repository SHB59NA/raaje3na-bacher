name: Load tactile drag desk v1.4.0
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach drag desk layer
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate tactile desk
        run: |
          node --check reception-v2.js
          node --check reception-v3.js
          node --check reception-graphics-v1.js
          node --check reception-drag-v1.js
          grep -q 'reception-drag-v1.js?v=1.4.0' index.html
          grep -q "const VERSION='v1.4.0'" reception-drag-v1.js
          grep -q "Pointer/touch driven inspection desk" reception-drag-v1.js
          grep -q "bindFolder" reception-drag-v1.js
          grep -q "bindStamps" reception-drag-v1.js
          grep -q "buildPapers" reception-drag-v1.js
          if grep -q 'new MutationObserver' reception-drag-v1.js; then
            echo 'Drag desk must stay event-driven'
            exit 1
          fi

      - name: Commit drag loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable tactile drag desk v1.4.0"
          git push
