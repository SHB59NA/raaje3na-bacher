name: Repair reception graphics v1.3.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch graphics loader
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate repaired graphics
        run: |
          node --check reception-graphics-v1.js
          grep -q "const GFX_VERSION='v1.3.1'" reception-graphics-v1.js
          grep -q 'reception-graphics-v1.js?v=1.3.1' index.html
          if grep -q 'new MutationObserver' reception-graphics-v1.js; then
            echo 'Graphics MutationObserver must stay removed'
            exit 1
          fi
          test -f assets/prototype/reception_scene_bg.webp
          test -f assets/prototype/crt_monitor.webp
          test -f assets/prototype/desk_phone.webp

      - name: Commit loader repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load mobile-safe graphics v1.3.1"
          git push
