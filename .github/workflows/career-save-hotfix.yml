           {name:'فهد أحمد',personality:'متفلسف ويعرف النظام أكثر منك',avatar:'young',service:'تصحيح بيانات مدنية',introLines:['أنا قاري التعميم، لا تشيل هم بشرح لك شغلك.','هذا المفروض يمشي مباشرة حسب المادة... مادري رقمها بس موجودة.'],idleLines:['هذا مو شغلك أصلاً، شغل الدور الرابع.','أنا أعرف النظام أكثر منكم.'],approveLines:['شايف؟ قلت لك إنها تمشي.'],rejectLines:['لا لا، تفسيرك للتعميم غلط.'],valid:true,dest:'identity',floor:'الدور 4',requirements:['إثبات الهوية','المستند المطلوب تصحيحه','مستند رسمي مؤيد'],docs:[['البطاقة','أصلية وسارية'],['طلب التصحيح','موقع'],['المستند المؤيد','أصلي وساري']],note:'المستندات كاملة رغم فلسفة المراجع.'},

           {name:'عادل يوسف',personality:'عصبي',avatar:'young',service:'نقل ملكية مركبة',introLines:['خلصني بسرعة ولا تعقدها.','إذا بتردني من الحين قول عشان ما أضيع وقتي.'],idleLines:['ترى مالي خلق.','ليش كل مرة نفس الأسئلة؟','لا ترفع ضغطي.'],approveLines:['إي جذي عدل.','زين، مو كل الموظفين ضايعين.'],rejectLines:['ها؟ على شنو؟','لا تقول ناقصة وتخليني أعصب.'],valid:true,dest:'vehicles',floor:'الدور 1',requirements:['تأمين ساري','دفتر المركبة','بطاقات الأطراف'],docs:[['التأمين','ساري'],['دفتر المركبة','أصلي'],['البطاقات','موجودة']],note:'الملف كامل. صاحب الملف مو هادي.'},

           {name:'غانم يوسف',personality:'سرحان ومو داري شنو معاملته',avatar:'old',service:'بدل فاقد بطاقة',introLines:['أنا ييت حق الرخصة... أو العنوان... لحظة شنو مكتوب بالملف؟','أمي قالتلي تعال هني بس ما قالت ليش.'],idleLines:['هذا ملفي ولا ملف أخوي؟','لحظة يمكن الورقة بجيب ثاني.','أنا بأي دور الحين؟'],approveLines:['زين... شنو سويت لي بالضبط؟'],rejectLines:['أوكي... شنو ناقص؟ نسيت أصلاً شنو أبي.'],valid:false,reason:'مستند أساسي ناقص',dest:'identity',floor:'الدور 4',requirements:['إثبات رسمي ساري','صورتان حديثتان','حضور صاحب العلاقة'],docs:[['إثبات رسمي','غير موجود'],['صورة واحدة','قديمة'],['صاحب العلاقة','حاضر بس محتار']],note:'المراجع مو داري، والملف فعلاً ناقص.'},

           {name:'راشد سالم',personality:'مواطن طبيعي جداً جداً',avatar:'young',service:'تغيير عنوان — سجل غير مصنف',introLines:['أنا مواطن طبيعي جداً وأبي عنواناً طبيعياً جداً.','تحية بشرية اعتيادية. أريد إنهاء المعاملة البشرية.'],idleLines:['لا يوجد ما يدعو للقلق.','أوراقي سليمة مثل بقية البشر.','لا تدقق بأصابعي لو سمحت.'],approveLines:['ممتاز. تم تسجيل تعاون الموظف البشري... أقصد يعطيك العافية.'],rejectLines:['تم رصد المقاومة البشرية... أقصد شكراً على المعلومة.'],valid:true,dest:'special',floor:'القبو',requirements:['الملف السكني كامل','إذا ظهر «غير مصنف» يحال للحالات الخاصة'],docs:[['بطاقات الأسرة','كاملة'],['عقد السكن','مرفق'],['إقرار السكن','مرفق'],['تنبيه النظام','غير مصنف']],note:'المستندات كاملة لكن النظام يطلب تصنيف خاص.'},

           {name:'منيرة يوسف',personality:'هادية بس أوراقها كلها غلط',avatar:'woman',service:'تصحيح بيانات مدنية',introLines:['السلام عليكم، خذ راحتك ودقق عدل.','ما عندي استعجال، أهم شي كل شي يكون صح.'],idleLines:['إذا في شي غلط قول لي عادي.','أنا متأكدة تقريباً إن الأوراق صح... تقريباً.'],approveLines:['يعطيك العافية، ما قصرت.'],rejectLines:['أوكي فهمت، عدل. أرد أجيب الصحيح.'],valid:false,reason:'بيانات غير مطابقة',dest:'identity',floor:'الدور 4',requirements:['إثبات الهوية','المستند المطلوب تصحيحه','مطابقة الاسم والرقم المدني'],docs:[['البطاقة','منيرة يوسف'],['طلب التصحيح','منيرة يونس'],['الرقم المدني','رقم مختلف بخانة واحدة']],note:'أكثر من بيان غير مطابق.'},

           {name:'لولوة سالم',personality:'تحاول تضبط الموظف',avatar:'woman',service:'إثبات سكن',introLines:['هلا والله... إن شاء الله تخلصها لي بسرعة.','ما راح تتعبك معاملتي، بسيطة وايد.'],idleLines:['بس ختم صغير ونفتك.','أحسك إنسان متعاون.','يعني أكيد ما راح تردني صح؟'],approveLines:['كنت عارفة إنك ذوق.','يعطيك العافية، ما قصرت.'],rejectLines:['معقولة تردني؟','يعني ما تمشيها لي هالمرة؟'],valid:false,reason:'بيانات غير مطابقة',dest:'housing',floor:'الدور 3',requirements:['بطاقة أصلية','عقد سكن مطابق','إقرار سكن موقع'],docs:[['البطاقة','أصلية'],['عقد السكن','الرقم الآلي غير مطابق'],['إقرار السكن','موقع']],note:'الكلام حلو، الرقم الآلي مو حلو.'},

           {name:'دانة بدر',personality:'دلوعة بنت بابا وماما',avatar:'woman',service:'بدل فاقد بطاقة',introLines:['أنا أبي أخلص بسرعة، مستعجلة.','ليش لازم أنطر مثل كل الناس؟'],idleLines:['ماما قالت الموضوع سهل.','بابا قال إذا طولوا عليك دقي علي.','أنا مو متعودة أراجع بروحي.'],approveLines:['أخيراً، كنت أدري إنها بسيطة.','تمام زين، بقول لماما خلصت.'],rejectLines:['شنو يعني Screenshot مو مقبول؟','مو معقولة لازم أرجع مرة ثانية.'],valid:false,reason:'مستند أساسي ناقص',dest:'identity',floor:'الدور 4',requirements:['إثبات رسمي ساري','صورتان حديثتان','حضور صاحب العلاقة'],docs:[['Screenshot','من ألبوم الصور'],['صورتان','حديثتان'],['صاحب العلاقة','حاضرة']],note:'ماكو إثبات رسمي ساري.'},

           {name:'نورة محمد',personality:'لسانها طويل وشوي وتطق الطاولة',avatar:'woman',service:'تجديد بطاقة',introLines:['خلصني بسرعة ولا تعقدها.','إذا بتقول ناقص من الحين قول قبل لا أتنرفز.'],idleLines:['لا تكثر علي أسئلة.','ترى شوي وأطق الطاولة مو أنت.','شنو قاعد تدقق من الصبح؟'],approveLines:['إي جذي عدل.','زين، عيل تعرف تشتغل.'],rejectLines:['ها؟ على شنو؟','لا ترفع ضغطي وتقول ناقصة.','ورني شنو ناقص قبل لا أسوي سالفة.'],valid:true,dest:'identity',floor:'الدور 4',requirements:['البطاقة الحالية','صورة حديثة','طلب التجديد موقع'],docs:[['البطاقة الحالية','سارية'],['الصورة','حديثة'],['طلب التجديد','موقع']],note:'المعاملة كاملة. مستوى الهدوء: صفر.'}
          ];'''

          s, n = re.subn(r"const intakePool=\[.*?\n\];\n\nfunction intakeDocHTML", new_pool + "\n\nfunction intakeDocHTML", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace intakePool')

          s = s.replace("function shuffle(a){return [...a].sort(()=>Math.random()-.5)}", "function randLine(list){return list&&list.length?list[Math.floor(Math.random()*list.length)]:''}\nfunction shuffle(a){return [...a].sort(()=>Math.random()-.5)}")
          s = s.replace("$('#intakeDialogue').textContent=c.greeting;", "$('#intakeDialogue').textContent=randLine(c.introLines)||c.greeting||'السلام عليكم.';")
          s = s.replace("$('#intakeMeta').innerHTML=`<b>${esc(c.name)}</b><br>${esc(c.service)}<br>ملاحظة الملف: ${esc(c.note)}`;", "$('#intakeMeta').innerHTML=`<b>${esc(c.name)}</b><br><span class=\"tag\">الشخصية: ${esc(c.personality||'عادي')}</span><br><br>${esc(c.service)}<br>ملاحظة الملف: ${esc(c.note)}`;")
          s = s.replace("$('#intakeNotice').textContent='دقق المرفقات. إذا كامل اختار معتمد وحدد الوزارة والدور. إذا ناقص اختار رفض وحدد السبب.';", "$('#intakeNotice').textContent='دقق المرفقات وقرر. اضغط على المراجع إذا تبي تسمع تعليق ثاني منه.';")
          s = s.replace("if(c.wasta)$('#intakeWastaBox').innerHTML='<b>واسطة موجودة:</b><br>'+esc(c.wasta)}", "if(c.wasta)$('#intakeWastaBox').innerHTML='<b>واسطة موجودة:</b><br>'+esc(c.wasta);$('#intakeAvatar').title='اضغط لسماع تعليق ثاني';$('#intakeAvatar').onclick=()=>{const line=randLine(c.idleLines);if(line)$('#intakeDialogue').textContent=line}")

          s = s.replace("finishDecision(ok,why,'intake')}", "finishDecision(ok,why,'intake','approve')}")
          s = s.replace(",'intake')})};", ",'intake','reject')})};")

          old_finish = "function finishDecision(ok,why,stage){if(busy)return;busy=true;if(ok){dayScore++;adjustSalary(REWARD);feedback('✓ صح<br><span class=\"tiny\">'+esc(why)+'</span>','goodFb')}else{dayWrong++;if(!adjustSalary(-PENALTY))return;feedback('✕ غلط<br><span class=\"tiny\">'+esc(why)+'</span>','badFb')}setTimeout(()=>afterCase(stage),1350)}"
          new_finish = "function finishDecision(ok,why,stage,reactionType=''){if(busy)return;busy=true;let reaction='';if(stage==='intake'){const c=currentBatch[caseIndex];const lines=reactionType==='approve'?c.approveLines:reactionType==='reject'?c.rejectLines:null;reaction=randLine(lines);if(reaction)$('#intakeDialogue').textContent=reaction}const quote=reaction?'<br><span class=\"tiny\">«'+esc(reaction)+'»</span>':'';if(ok){dayScore++;adjustSalary(REWARD);feedback('✓ صح<br><span class=\"tiny\">'+esc(why)+'</span>'+quote,'goodFb',1750)}else{dayWrong++;if(!adjustSalary(-PENALTY))return;feedback('✕ غلط<br><span class=\"tiny\">'+esc(why)+'</span>'+quote,'badFb',1750)}setTimeout(()=>afterCase(stage),1950)}"
          if old_finish not in s:
              raise SystemExit('Could not replace finishDecision')
          s = s.replace(old_finish, new_finish)

          s = s.replace("function resolveWasta(stage){if(busy)return;busy=true;", "function resolveWasta(stage){if(busy)return;busy=true;if(stage==='intake'){const c=currentBatch[caseIndex],line=randLine(c.wastaLines||c.idleLines);if(line)$('#intakeDialogue').textContent=line}")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit visitor personality test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add 13 reception visitor personalities and reactive dialogue"
          git push
