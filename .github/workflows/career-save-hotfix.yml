name: Load char_01 layout preview v1.5.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump char_01 preview loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="char01-preview-v1.js?v=1.5.0"></script>'
          new='<script src="char01-preview-v1.js?v=1.5.1"></script>'
          assert old in s or new in s, 'char01 preview loader not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate layout preview
        run: |
          node --check char01-preview-v1.js
          grep -q 'char01-preview-v1.js?v=1.5.1' index.html
          grep -q 'char01PanelToggle' char01-preview-v1.js
          grep -q 'char01GamePreview' char01-preview-v1.js
          if grep -q 'new MutationObserver' char01-preview-v1.js; then
            echo 'Preview must stay event-driven'
            exit 1
          fi

      - name: Commit loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load char_01 layout preview v1.5.1"
          git push
