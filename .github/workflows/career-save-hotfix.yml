           {name:'أم بدر',personality:'عجوز نسرة',avatar:'old woman',service:'بدل فاقد بطاقة',introLines:['دقق عدل قبل لا تتفلسف علي.','أنا فاهمة الشغل أكثر من نص الموظفين.'],idleLines:['لا تلف وتدور علي.','تراني مو من أمس أراجع.','شوف الورق عدل قبل لا تقول ناقص.'],approveLines:['زين، طلعت تفهم شوي.','هذا المفروض من أول.'],rejectLines:['على شنو ترفض؟ ورني بعينك شنو ناقص.','لا تتفلسف، قل السبب عدل.'],valid:false,reason:'مستند أساسي ناقص',dest:'identity',floor:'الدور 4',requirements:['إثبات رسمي ساري','صورتان حديثتان','حضور صاحب العلاقة'],docs:[['صورة البطاقة القديمة','نسخة فقط'],['صورتان','حديثتان'],['صاحب العلاقة','حاضرة']],note:'لا يوجد إثبات رسمي ساري.'},

           {name:'مشعل بدر',personality:'معاه واسطة',avatar:'young',service:'طلب بدل إيجار',introLines:['لا تدقق وايد، الموضوع معروف فوق.','أنا مرسليني من فوق... خلصنا بس.'],idleLines:['دق على اللي فوق إذا مو مصدق.','أبوي يعرف ناس هني.'],approveLines:['كنت عارف إنك فاهم الوضع.'],rejectLines:['أكيد تبي ترفضها؟ فكر مرة ثانية.'],wastaLines:['بيننا وبينك... مشّها وخلاص.','ترى الورقة الصفراء مو للزينة.'],valid:false,reason:'مستند أساسي ناقص',dest:'housing',floor:'الدور 3',wasta:'ورقة صفراء: «مشّها، الموضوع معروف فوق.»',requirements:['طلب بدل الإيجار','إثبات الاستحقاق','عقد الإيجار','المستند المؤيد للحالة'],docs:[['الطلب','موقع'],['إثبات الاستحقاق','مرفق'],['عقد الإيجار','مرفق'],['المستند المؤيد','غير موجود']],note:'ناقص مستند أساسي.'},

           {name:'نوال عبدالله',personality:'درامية وتكسر الخاطر',avatar:'woman',service:'تغيير عنوان الأسرة',introLines:['تكفى لا تردني، صارلي أربع أيام أراجع.','عيالي ناطريني، خلصني اليوم الله يخليك.'],idleLines:['لا تقول ناقص... قلبي ما يتحمل.','أنا من الصبح ما شربت حتى ماي.'],approveLines:['الله يسعدك، أنقذتني.','أخيراً خلصت!'],rejectLines:['لااا، مو مرة ثانية.','يعني برد باچر بعد؟'],valid:false,reason:'الأسرة غير مكتملة',dest:'identity',floor:'الدور 4',requirements:['بطاقات الأسرة الأصلية','عقد السكن','إقرار السكن','جميع أفراد الأسرة ضمن الطلب'],docs:[['بطاقة نوال','أصلية'],['عقد السكن','مرفق'],['إقرار السكن','مرفق'],['بطاقات الأسرة','بطاقة واحدة من 3']],note:'الطلب لفرد واحد فقط.',family:[['نوال عبدالله','266091401987']],missing:'ناقص بطاقتين'},

