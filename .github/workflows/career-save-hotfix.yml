name: Load and validate reception gameplay prototype
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach reception v2 gameplay
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="reception-v2.js?v=1.1.0"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate embedded game JavaScript
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          if not m:
              raise SystemExit('No embedded game script found')
          Path('/tmp/base-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/base-game.js

      - name: Validate reception v2 JavaScript
        run: node --check reception-v2.js

      - name: Validate reception v2 features
        run: |
          python <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('reception-v2.js').read_text(encoding='utf-8')
          required_html=['<script src="reception-v2.js?v=1.1.0"></script>','id="intakeScreen"','id="approveRouteBtn"','id="rejectReasonBtn"']
          required_js=[
            "const QUESTIONS_PER_CASE=3",
            "salary=100;day=1;wastaHeat=0;rank=1",
            "استلم الملف من المراجع",
            "الكمبيوتر",
            "التلفون",
            "دفتر التعاميم",
            "ملاحظة / تناقض",
            "نوع المعاملة",
            "resolveIntakeApproveV2",
            "قرار الصح +5",
            "الغلط -10",
            "-50 دينار",
            "الغريب مو معناته مرفوض"
          ]
          for token in required_html:
              if token not in html:
                  raise SystemExit('Missing HTML hook: '+token)
          for token in required_js:
              if token not in js:
                  raise SystemExit('Missing gameplay feature: '+token)
          if js.count("minDay:") < 13:
              raise SystemExit('Expected profiles for 13 reception visitors')
          if js.count("questions:[") < 13:
              raise SystemExit('Expected question sets for 13 reception visitors')
          print('Reception v1.1.0 gameplay feature audit passed.')
          PY

      - name: Commit prototype loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load enhanced reception gameplay prototype"
          git push
