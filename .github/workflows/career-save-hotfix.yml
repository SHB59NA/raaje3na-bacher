name: Hotfix inspection observer freeze v1.2.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch inspection observer
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate no observer loops
        run: |
          node --check reception-v3.js
          node --check reception-graphics-v1.js
          grep -q "const VERSION='v1.2.1'" reception-v3.js
          grep -q 'reception-v3.js?v=1.2.1' index.html
          grep -q 'reception-graphics-v1.js?v=1.3.1' index.html
          if grep -q 'new MutationObserver' reception-v3.js; then
            echo 'Inspection MutationObserver still present'
            exit 1
          fi
          if grep -q 'new MutationObserver' reception-graphics-v1.js; then
            echo 'Graphics MutationObserver still present'
            exit 1
          fi

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reception-v3.js index.html
          git diff --cached --quiet || git commit -m "Fix mobile observer freeze v1.2.1"
          git push
