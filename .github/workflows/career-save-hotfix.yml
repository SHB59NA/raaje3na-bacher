name: Apply Career stage visibility hotfix
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide supervisor and higher management stages
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('Career v1.0.2</title>','Career v1.0.3</title>').replace('v1.0.2 // CAREER SYSTEM','v1.0.3 // CAREER SYSTEM').replace('<div class=\"career-step\" id=\"step3\">3 — مراقب • 400 د.ك</div>','<div class=\"career-step hidden\" id=\"step3\">3 — مراقب • 400 د.ك</div>').replace('إذا وصل معاشك 200 تترقى لموظف وزارة وتشتغل على النظام. عند 400 تصير مراقب وتراجع كتب الموظفين ومشاكلهم. والواسطة؟ تمشي... لين تنصاد.','إذا وصل معاشك 200 تترقى لموظف وزارة وتشتغل على النظام. والواسطة؟ تمشي... لين تنصاد.').replace('function rankNext(){return rank===1?200:rank===2?400:null}','function rankNext(){return rank===1?200:null}').replace("let rank=num(localStorage.getItem(SAVE.rank),1); if((rank===2&&salary<200)||(rank===3&&salary<400)||![1,2,3].includes(rank)) rank=1;","let rank=num(localStorage.getItem(SAVE.rank),1); if(![1,2].includes(rank)) rank=salary>=200?2:1; if(rank===2&&salary<200) rank=1;").replace("$('#startCareerBtn').textContent=rank===1?'ابدأ دوام الاستقبال':rank===2?'ادخل الوزارة':'افتح مكتب المراقب';","$('#startCareerBtn').textContent=rank===1?'ابدأ دوام الاستقبال':'ادخل الوزارة';").replace('if(rank===2&&salary>=400){rank=3;save();showPromotion(3);return}','').replace("$('#nextDayBtn').onclick=()=>{day++;save();if(rank===1)startIntakeDay();else if(rank===2)startMinistryDay();else startSupervisorDay()};","$('#nextDayBtn').onclick=()=>{day++;save();if(rank===1)startIntakeDay();else startMinistryDay()};").replace("$('#briefGoBtn').onclick=()=>{if(rank===1)startIntakeDay();else if(rank===2)startMinistryDay();else startSupervisorDay()};","$('#briefGoBtn').onclick=()=>{if(rank===1)startIntakeDay();else startMinistryDay()};"); p.write_text(s,encoding='utf-8')"
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Hide supervisor and higher management stages temporarily"
          git push
