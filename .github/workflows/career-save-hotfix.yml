name: Lock and validate reception-only build
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lock game to reception only
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<title>راجعنا باچر — Career v1.0.6</title>', '<title>راجعنا باچر — Reception v1.0.7</title>')
          s = s.replace('<div class="subtitle">CAREER MODE</div>', '<div class="subtitle">RECEPTION DESK</div>')
          s = s.replace('<span>NEXT</span><b id="titleNext">200 KD</b>', '<span>DAY</span><b id="titleDay">DAY 1</b>')
          s = s.replace('v1.0.6 // VISITOR PERSONALITIES', 'v1.0.7 // RECEPTION COMPLETE')

          old_screens = "const screens=['titleScreen','briefScreen','intakeScreen','promotionScreen','ministrySelectScreen','coworkerSelectScreen','ministryScreen','supervisorScreen','dayEndScreen','fireScreen'];\nfunction show(id){screens.forEach(x=>$('#'+x).classList.add('hidden'));$('#'+id).classList.remove('hidden')}\nfunction rankNext(){return null}"
          new_screens = "const screens=['titleScreen','briefScreen','intakeScreen','promotionScreen','ministrySelectScreen','coworkerSelectScreen','ministryScreen','supervisorScreen','dayEndScreen','fireScreen'];\nconst receptionScreens=new Set(['titleScreen','briefScreen','intakeScreen','dayEndScreen','fireScreen']);\nfunction show(id){if(!receptionScreens.has(id))id='titleScreen';screens.forEach(x=>{const el=$('#'+x);if(el)el.classList.add('hidden')});const target=$('#'+id);if(target)target.classList.remove('hidden')}\nfunction rankNext(){return null}"
          if old_screens not in s:
              raise SystemExit('Screen router pattern not found')
          s = s.replace(old_screens, new_screens, 1)

          new_update = "\n".join([
              "function updateTitle(){",
              " $('#titleRank').textContent='موظف استقبال';",
              " $('#titleSalary').textContent=salary+' KD';",
              " if($('#titleDay'))$('#titleDay').textContent='DAY '+day;",
              " $('#titleHeat').textContent=wastaHeat+'%';",
              " if($('#step1'))$('#step1').classList.add('unlocked');",
              " $('#startCareerBtn').textContent='ابدأ دوام الاستقبال';",
              "}",
              "function updateBars(){",
              " if($('#intakeSalary'))$('#intakeSalary').textContent='SALARY '+salary+' KD';",
              " if($('#intakeHeat'))$('#intakeHeat').textContent='WASTA '+wastaHeat+'%';",
              "}"
          ])
          s, n = re.subn(r"function updateTitle\(\)\{[\s\S]*?\n\}\nfunction updateBars\(\)\{[\s\S]*?\n\}", lambda m: new_update, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace title/bar functions')

          new_end = "\n".join([
              "function finishDay(stage){",
              " const gain=salary-dayStartSalary;",
              " $('#dayEndTitle').textContent='نهاية دوام الاستقبال — اليوم '+day;",
              " $('#dayStats').innerHTML=`<div class=\"infoCard\"><b>${dayScore}</b>قرارات صحيحة</div><div class=\"infoCard\"><b>${dayWrong}</b>أخطاء / انكشاف</div><div class=\"infoCard\"><b>${gain>=0?'+':''}${gain} د.ك</b>صافي اليوم</div>`;",
              " $('#dayMessage').innerHTML=`المعاش الحالي: <b>${salary} د.ك</b><br>خلص دوام الاستقبال. تقدر تبدأ اليوم الياي أو ترجع للقائمة.`;",
              " $('#nextDayBtn').dataset.stage='intake';",
              " show('dayEndScreen');",
              "}",
              "$('#nextDayBtn').onclick=()=>{day++;save();startIntakeDay()};",
              "$('#dayBackTitleBtn').onclick=()=>{day++;save();updateTitle();show('titleScreen')};"
          ])
          s, n = re.subn(r"function finishDay\(stage\)\{[^\n]*\}\n\$\('#nextDayBtn'\)\.onclick=[^\n]*\n\$\('#dayBackTitleBtn'\)\.onclick=[^\n]*", lambda m: new_end, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace end-of-day navigation')

          new_brief = "\n".join([
              "function showBriefAndStart(){",
              " const title='تعميم رقم 01 — الاستقبال والتوجيه';",
              " const html=`<div class=\"grid3\"><div class=\"infoCard\"><b>إذا الملف كامل</b>اضغط «معتمد»، وبعدها اختار الجهة والدور الصح. التوجيه جزء من القرار.</div><div class=\"infoCard\"><b>إذا الملف ناقص أو غلط</b>اضغط «رفض» واختار السبب الحقيقي. «ناقص شي» بروحها ما تمشي.</div><div class=\"infoCard\"><b>الواسطة</b>تقدر تمشيها. إذا ما انصدت تمر بدون +5. إذا انصدت: -50 د.ك. وكل واسطة تعدي ترفع احتمال التفتيش.</div></div>`;",
              " $('#briefTitle').textContent=title;",
              " $('#briefContent').innerHTML=html;",
              " show('briefScreen');",
              "}",
              "$('#briefGoBtn').onclick=()=>startIntakeDay();"
          ])
          s, n = re.subn(r"function showBriefAndStart\(\)\{[^\n]*\}\n\$\('#briefGoBtn'\)\.onclick=[^\n]*", lambda m: new_brief, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace reception brief routing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', html)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/game.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/game.js

      - name: Validate reception UI routing and visitor data
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          js_match = re.search(r'<script>([\s\S]*?)</script>', html)
          if not js_match:
              raise SystemExit('No JavaScript block')
          js = js_match.group(1)

          required_html = [
              'RECEPTION DESK', 'id="titleDay"', 'v1.0.7 // RECEPTION COMPLETE',
              'id="startCareerBtn"', 'id="briefGoBtn"', 'id="approveRouteBtn"',
              'id="rejectReasonBtn"', 'id="nextDayBtn"', 'id="fireResetBtn"'
          ]
          for token in required_html:
              if token not in html:
                  raise SystemExit('Missing reception UI token: ' + token)

          if '<div class="career-step hidden" id="step2">' not in html:
              raise SystemExit('Ministry stage is not hidden')
          if '<div class="career-step hidden" id="step3">' not in html:
              raise SystemExit('Supervisor stage is not hidden')

          required_js = [
              "const receptionScreens=new Set(['titleScreen','briefScreen','intakeScreen','dayEndScreen','fireScreen'])",
              "$('#startCareerBtn').onclick=()=>showBriefAndStart();",
              "$('#briefGoBtn').onclick=()=>startIntakeDay();",
              "$('#nextDayBtn').onclick=()=>{day++;save();startIntakeDay()};",
              "let rank=1; localStorage.setItem(SAVE.rank,'1');"
          ]
          for token in required_js:
              if token not in js:
                  raise SystemExit('Missing reception routing lock: ' + token)

          pool_match = re.search(r"const intakePool=(\[[\s\S]*?\]);\n\nfunction intakeDocHTML", js)
          if not pool_match:
              raise SystemExit('Could not find intakePool')
          pool = pool_match.group(1)

          if pool.count('personality:') < 13:
              raise SystemExit('Expected at least 13 personality visitors')
          for field in ['introLines:', 'approveLines:', 'rejectLines:', 'requirements:', 'docs:']:
              if pool.count(field) < 13:
                  raise SystemExit('Visitor field missing from one or more cases: ' + field)

          valid_dests = {'housing','interior','vehicles','identity','special'}
          for dest in re.findall(r"dest:'([^']+)'", pool):
              if dest not in valid_dests:
                  raise SystemExit('Invalid reception destination: ' + dest)

          valid_floors = {'الدور 1','الدور 2','الدور 3','الدور 4','القبو'}
          for floor in re.findall(r"floor:'([^']+)'", pool):
              if floor not in valid_floors:
                  raise SystemExit('Invalid reception floor: ' + floor)

          reasons_match = re.search(r"const rejectReasons=(\[[^\n]+\]);", js)
          if not reasons_match:
              raise SystemExit('Could not find rejectReasons')
          allowed_reasons = set(re.findall(r"'([^']+)'", reasons_match.group(1)))
          for reason in re.findall(r"valid:false,reason:'([^']+)'", pool):
              if reason not in allowed_reasons:
                  raise SystemExit('Invalid reject reason: ' + reason)

          if 'slice(0,6)' not in js:
              raise SystemExit('Reception day must load 6 visitors')

          print('Reception-only audit passed: 13+ visitors, 6 per day, routes locked.')
          PY

      - name: Commit reception-only audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Lock complete reception-only gameplay loop"
          git push
