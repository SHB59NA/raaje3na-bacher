name: Validate reception build
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract JavaScript
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', html)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/game.js').write_text(m.group(1), encoding='utf-8')
          print('Extracted JS chars:', len(m.group(1)))
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/game.js
