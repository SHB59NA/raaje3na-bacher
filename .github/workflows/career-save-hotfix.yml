name: Polish reception conversations v1.1.1
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix conversation copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reception-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// راجعنا باچر — Reception Gameplay Prototype v1.1.0','// راجعنا باچر — Reception Gameplay Prototype v1.1.1',1)
          s=s.replace("appendConversation('visitor','تفضل، هذد الملف.');","appendConversation('visitor','تفضل، هذا الملف.');",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check reception-v2.js
      - name: Commit copy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reception-v2.js
          git diff --cached --quiet || git commit -m "Polish reception conversation copy"
          git push
