name: Apply reception-only hotfix
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only reception stage active
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('Career v1.0.2</title>','Career v1.0.4</title>').replace('Career v1.0.3</title>','Career v1.0.4</title>').replace('v1.0.2 // CAREER SYSTEM','v1.0.4 // RECEPTION ONLY').replace('v1.0.3 // CAREER SYSTEM','v1.0.4 // RECEPTION ONLY').replace('<div class=\"career-step\" id=\"step2\">2 — موظف وزارة • 200 د.ك</div>','<div class=\"career-step hidden\" id=\"step2\">2 — موظف وزارة • 200 د.ك</div>').replace('<div class=\"career-step\" id=\"step3\">3 — مراقب • 400 د.ك</div>','<div class=\"career-step hidden\" id=\"step3\">3 — مراقب • 400 د.ك</div>').replace('<div class=\"career-step hidden\" id=\"step3\">3 — مراقب • 400 د.ك</div>','<div class=\"career-step hidden\" id=\"step3\">3 — مراقب • 400 د.ك</div>').replace('ابدأ موظف استقبال، دقق معاملات كل الجهات ووجّهها للوزارة والدور الصح. إذا وصل معاشك 200 تترقى لموظف وزارة وتشتغل على النظام. عند 400 تصير مراقب وتراجع كتب الموظفين ومشاكلهم. والواسطة؟ تمشي... لين تنصاد.','استلم معاملات المراجعين، دقق الأوراق ووجّه المعاملة للجهة والدور الصح. المرحلة الحالية تركز بالكامل على الاستقبال والواسطة والتدقيق.').replace('ابدأ موظف استقبال، دقق معاملات كل الجهات ووجّهها للوزارة والدور الصح. إذا وصل معاشك 200 تترقى لموظف وزارة وتشتغل على النظام. والواسطة؟ تمشي... لين تنصاد.','استلم معاملات المراجعين، دقق الأوراق ووجّه المعاملة للجهة والدور الصح. المرحلة الحالية تركز بالكامل على الاستقبال والواسطة والتدقيق.').replace('function rankNext(){return rank===1?200:rank===2?400:null}','function rankNext(){return null}').replace('function rankNext(){return rank===1?200:null}','function rankNext(){return null}').replace('if(rank===1&&salary>=200){rank=2;save();showPromotion(2);return}','').replace('if(rank===2&&salary>=400){rank=3;save();showPromotion(3);return}',''); s=re.sub(r\"let rank=num\\(localStorage\\.getItem\\(SAVE\\.rank\\),1\\);[^\\n]*\",\"let rank=1; localStorage.setItem(SAVE.rank,'1');\",s,count=1); s=s.replace(\"$('#titleNext').textContent=rankNext()?rankNext()+' KD':'MAX RANK';\",\"$('#titleNext').textContent='استقبال فقط';\"); p.write_text(s,encoding='utf-8')"
      - name: Commit reception-only mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Keep only reception stage active for now"
          git push
