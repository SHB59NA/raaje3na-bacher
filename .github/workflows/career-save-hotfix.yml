name: Apply Career save hotfix
on:
  push:
    paths:
      - '.github/workflows/career-save-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Career save namespace
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('Career v1.0</title>','Career v1.0.1</title>').replace('v1.0 // CAREER SYSTEM','v1.0.1 // CAREER SYSTEM').replace('raaje3na_salary_v1','raaje3na_career_salary_v1').replace('raaje3na_rank_v1','raaje3na_career_rank_v1').replace('raaje3na_ministry_v1','raaje3na_career_ministry_v1').replace('raaje3na_coworker_v1','raaje3na_career_coworker_v1').replace('raaje3na_wasta_heat_v1','raaje3na_career_wasta_heat_v1').replace('raaje3na_day_v1','raaje3na_career_day_v1').replace('let rank=num(localStorage.getItem(SAVE.rank),salary>=400?3:salary>=200?2:1);','let rank=num(localStorage.getItem(SAVE.rank),1);'); p.write_text(s,encoding='utf-8')"
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Career save migration and starting rank"
          git push
