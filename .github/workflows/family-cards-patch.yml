name: Apply family cards patch

on:
  push:
    paths:
      - '.github/workflows/family-cards-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch family cards UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>راجعنا باچر — Prototype v0.6</title>','<title>راجعنا باچر — Prototype v0.6.1</title>')
          s=s.replace('PROTOTYPE v0.6 // SALARY SYSTEM','PROTOTYPE v0.6.1 // FAMILY CARDS')

          old=".field.deceased{background:#d9aaa1;color:#7c211e;font-weight:900}.paper-note{font-size:9px;line-height:1.55;padding:8px;border:2px dashed #8d8368;background:#ddd3aa}"
          new=".field.deceased{background:#d9aaa1;color:#7c211e;font-weight:900}.paper.has-family{min-height:360px}.paper.zoomed.has-family{min-height:470px}.family-stack{clear:both;margin-top:8px;display:grid;gap:7px}.family-label{font-size:9px;font-weight:900;border-top:3px solid #2d322b;padding-top:6px;margin-bottom:1px}.family-card{position:relative;background:#d7e1dc;border:3px solid #26312b;padding:6px 6px 5px 42px;box-shadow:3px 3px 0 rgba(0,0,0,.18)}.family-card.missing-card{background:#d9aaa1;color:#75231f;padding:8px;font-weight:900}.family-card-head{font-size:9px;font-weight:900;border-bottom:2px solid #708079;padding-bottom:3px;margin-bottom:2px}.family-photo{position:absolute;left:6px;top:26px;width:29px;height:35px;border:3px solid #27312c;background:#9aa89f}.family-photo:before{content:\"\";position:absolute;width:11px;height:11px;background:#7b6a5e;left:6px;top:4px;box-shadow:0 12px 0 4px #68766e}.family-card .field{grid-template-columns:60px 1fr;font-size:8px;padding:3px 2px}.family-card .field b{font-size:8px}.paper-note{font-size:9px;line-height:1.55;padding:8px;border:2px dashed #8d8368;background:#ddd3aa}"
          assert old in s, 'CSS anchor missing'
          s=s.replace(old,new)

          old="{type:'id',title:'بطاقات الأسرة',fields:{status:'أصلية',included:'الأسرة كاملة'}}"
          new="{type:'id',title:'بطاقات الأسرة الأصلية',fields:{status:'أصلية',included:'4 بطاقات'},cards:[{relation:'صاحب العلاقة',fields:{name:'سالم محمد',civil:'258051201234',dob:'12/05/1958',status:'سارية'}},{relation:'الزوجة',fields:{name:'منى عبدالله',civil:'263071401876',dob:'14/07/1963',status:'سارية'}},{relation:'الابن',fields:{name:'يوسف سالم',civil:'299031500412',dob:'15/03/1999',status:'سارية'}},{relation:'الابنة',fields:{name:'لولوة سالم',civil:'305090800633',dob:'08/09/2005',status:'سارية'}}]}"
          assert old in s, 'Salem family anchor missing'
          s=s.replace(old,new,1)

          old="{type:'id',title:'بطاقة صاحبة العلاقة',fields:{name:'نوال عبدالله',family:'3 أفراد بالنظام'}}"
          new="{type:'id',title:'بطاقات الأسرة المقدمة',fields:{family:'3 أفراد بالنظام',included:'بطاقة واحدة فقط'},cards:[{relation:'صاحبة العلاقة',fields:{name:'نوال عبدالله',civil:'266091401987',dob:'14/09/1966',status:'سارية'}}],missingCards:'ناقص بطاقتين من أفراد الأسرة'}"
          assert old in s, 'Nawal family anchor missing'
          s=s.replace(old,new,1)

          old="{type:'id',title:'بطاقات الأسرة',fields:{status:'أصلية',included:'الأسرة كاملة'}}"
          new="{type:'id',title:'بطاقات الأسرة الأصلية',fields:{status:'أصلية',included:'3 بطاقات'},cards:[{relation:'صاحب العلاقة',fields:{name:'فهد أحمد',civil:'295071500777',dob:'15/07/1995',status:'سارية'}},{relation:'الزوجة',fields:{name:'ريم يوسف',civil:'297021100684',dob:'11/02/1997',status:'سارية'}},{relation:'الابن',fields:{name:'بدر فهد',civil:'319060300245',dob:'03/06/2019',status:'سارية'}}]}"
          assert old in s, 'Fahad family anchor missing'
          s=s.replace(old,new,1)

          old="const labels={name:'الاسم',status:'الحالة',family:'الأسرة',included:'المشمولون',tenant:'المستأجر',owner:'المالك',area:'المنطقة',block:'القطعة',street:'الشارع',building:'المبنى',auto:'الرقم الآلي',residents:'الساكنون',signatures:'التواقيع',action:'المعاملة',fee:'الرسوم',count:'العدد',original:'أصلي',seller:'البائع',death:'تاريخ الوفاة',match:'المطابقة'};"
          new="const labels={name:'الاسم',civil:'الرقم المدني',dob:'تاريخ الميلاد',relation:'صلة القرابة',status:'الحالة',family:'الأسرة',included:'المشمولون',tenant:'المستأجر',owner:'المالك',area:'المنطقة',block:'القطعة',street:'الشارع',building:'المبنى',auto:'الرقم الآلي',residents:'الساكنون',signatures:'التواقيع',action:'المعاملة',fee:'الرسوم',count:'العدد',original:'أصلي',seller:'البائع',death:'تاريخ الوفاة',match:'المطابقة'};"
          assert old in s, 'labels anchor missing'
          s=s.replace(old,new)

          old='function renderFields(doc,idx){if(doc.note)return `<div class="paper-note">${esc(doc.note)}</div>`;return Object.entries(doc.fields||{}).map(([k,v])=>{const dead=k===\'death\'||String(v).includes(\'متوفي\')?\' deceased\':\'\';return `<div class="field${dead}" data-doc="${idx}" data-key="${k}" data-value="${esc(v)}"><b>${labels[k]||k}</b><span>${esc(v)}</span></div>`}).join(\'\')}'
          new='function renderFields(doc,idx){if(doc.note)return `<div class="paper-note">${esc(doc.note)}</div>`;let html=Object.entries(doc.fields||{}).map(([k,v])=>{const dead=k===\'death\'||String(v).includes(\'متوفي\')?\' deceased\':\'\';return `<div class="field${dead}" data-doc="${idx}" data-key="${k}" data-value="${esc(v)}"><b>${labels[k]||k}</b><span>${esc(v)}</span></div>`}).join(\'\');if(doc.cards&&doc.cards.length){html+=`<div class="family-stack"><div class="family-label">البطاقات المرفقة (${doc.cards.length})</div>`+doc.cards.map((card,cidx)=>`<div class="family-card"><div class="family-card-head">${esc(card.relation||\'فرد من الأسرة\')}</div><div class="family-photo"></div>${Object.entries(card.fields||{}).map(([k,v])=>{const dead=k===\'death\'||String(v).includes(\'متوفي\')?\' deceased\':\'\';return `<div class="field${dead}" data-doc="${idx}-card-${cidx}" data-key="${k}" data-value="${esc(v)}"><b>${labels[k]||k}</b><span>${esc(v)}</span></div>`}).join(\'\')}</div>`).join(\'\')+(doc.missingCards?`<div class="family-card missing-card">⚠ ${esc(doc.missingCards)}</div>`:\'\')+`</div>`}return html}'
          assert old in s, 'renderFields anchor missing'
          s=s.replace(old,new)

          old="p.className='paper';p.dataset.idx=idx;"
          new="p.className='paper'+(doc.cards&&doc.cards.length?' has-family':'');p.dataset.idx=idx;"
          assert old in s, 'paper class anchor missing'
          s=s.replace(old,new)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "raaje3na-bacher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/family-cards-patch.yml
          git commit -m "Show individual family civil cards"
          git push
