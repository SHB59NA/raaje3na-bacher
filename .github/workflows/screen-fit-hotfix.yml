name: Apply screen fit hotfix
on:
  push:
    paths:
      - '.github/workflows/screen-fit-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Prototype v0.6.2','Prototype v0.6.3')
          s=re.sub(r'PROTOTYPE v0\.6\.2[^<]*','PROTOTYPE v0.6.3 // SCREEN FIT',s)
          s=s.replace('.paper-zone{position:absolute;inset:10px 330px 68px 10px;border:3px dashed rgba(232,223,186,.22)}','.paper-zone{position:absolute;inset:10px 330px 68px 10px;border:3px dashed rgba(232,223,186,.22);overflow:hidden}')
          s=s.replace('.doc-tabs{position:absolute;left:12px;right:330px;bottom:10px;height:47px;display:flex;gap:6px;align-items:center;direction:rtl;z-index:300}', '.doc-tabs{position:absolute;left:12px;right:330px;bottom:10px;height:50px;display:flex;gap:6px;align-items:center;direction:rtl;z-index:300;overflow-x:auto;overflow-y:hidden;padding:0 2px;scrollbar-width:thin}')
          s=s.replace('.docchip{background:#cfc49b;border:4px solid #171b17;padding:7px 9px;font-size:9px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #0b0e0b}', '.docchip{flex:0 0 auto;background:#cfc49b;border:4px solid #171b17;padding:7px 9px;font-size:9px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #0b0e0b}')
          s=s.replace('.paper{position:absolute;width:252px;min-height:185px;background:var(--paper);border:5px solid #1b201b;box-shadow:7px 7px 0 rgba(0,0,0,.32);padding:8px 10px;z-index:5;user-select:none;touch-action:none}', '.paper{position:absolute;width:252px;min-height:185px;max-width:calc(100% - 8px);max-height:calc(100% - 8px);background:var(--paper);border:5px solid #1b201b;box-shadow:7px 7px 0 rgba(0,0,0,.32);padding:8px 10px;z-index:5;user-select:none;touch-action:none}')
          s=s.replace('.paper.zoomed{width:400px;min-height:300px;z-index:180!important;box-shadow:12px 12px 0 rgba(0,0,0,.42)}', '.paper.zoomed{width:min(430px,calc(100% - 12px));height:calc(100% - 12px);min-height:0;max-height:calc(100% - 12px);overflow:auto;z-index:180!important;box-shadow:12px 12px 0 rgba(0,0,0,.42)}')
          s=s.replace('.paper.has-family{min-height:360px}.paper.zoomed.has-family{min-height:470px}.family-stack{clear:both;margin-top:8px;display:grid;gap:7px}', '.paper.has-family{height:330px;min-height:0;overflow:hidden}.paper.has-family .family-stack{max-height:250px;overflow-y:auto;padding-left:3px}.paper.zoomed.has-family{height:calc(100% - 12px);min-height:0;overflow:auto}.paper.zoomed.has-family .family-stack{max-height:none;overflow:visible;grid-template-columns:1fr 1fr}.family-stack{clear:both;margin-top:8px;display:grid;gap:7px}')
          # add mobile single-column behavior for expanded family cards
          s=s.replace('@media(max-width:920px){', '@media(max-width:920px){.paper.zoomed.has-family .family-stack{grid-template-columns:1fr}.paper.zoomed{width:calc(100% - 10px)}')
          marker='function renderDocs(v){'
          helper="function fitPaperToZone(p){requestAnimationFrame(()=>{const z=$('#paperZone');if(!z)return;const maxX=Math.max(3,z.clientWidth-p.offsetWidth-6),maxY=Math.max(3,z.clientHeight-p.offsetHeight-6);let x=parseFloat(p.style.left)||3,y=parseFloat(p.style.top)||3;p.style.left=Math.max(3,Math.min(x,maxX))+'px';p.style.top=Math.max(3,Math.min(y,maxY))+'px'})}\n"
          if 'function fitPaperToZone' not in s:
              s=s.replace(marker,helper+marker)
          s=s.replace("p.classList.toggle('zoomed');p.style.zIndex=++zTop", "p.classList.toggle('zoomed');p.style.zIndex=++zTop;fitPaperToZone(p)")
          s=s.replace("p.classList.add('zoomed');setTimeout(()=>p.classList.remove('zoomed'),900)", "p.classList.add('zoomed');fitPaperToZone(p);setTimeout(()=>{p.classList.remove('zoomed');fitPaperToZone(p)},1200)")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/screen-fit-hotfix.yml
          git add index.html
          git commit -m "Fix family cards to fit on screen"
          git push origin main
